name: fednow-rtpay-golden
rail: fednow
vars:
  issueKey: RTPAY-123
governance:
  allowedRoles:
    - director
    - release-manager

steps:
  - name: Preflight checklist
    key: preflight_checklist
    type: preflight.checklist
    with:
      commands: ["python", "newman"]

  - name: Ensure AppLauncher session
    key: ensure_applauncher
    type: applauncher.ensure
    with:
      session: fednow-rtpay-golden
      command: python
      args: ["-m", "http.server", "8087"]
      cwd: .
      healthUrl: http://127.0.0.1:8087
      verifyTimeoutSec: 20

  - name: Run payments collection
    key: run_postman
    type: postman.run
    with:
      collection: examples/postman/fednow-rtpay-regression.postman_collection.json
      reporters: cli,json
      envVar:
        baseUrl: http://127.0.0.1:8087

  - name: Verify Mongo assertions
    key: verify_mongo
    type: mongo.verify
    with:
      uri: ${env.MONGO_URI}
      db: rtpay
      autoFilterTraceId: true
      queries:
        - name: ledgerRows
          collection: paymentLedger
          filter:
            runId: ${runId}
      assert:
        - query: ledgerRows
          op: gte
          value: 1

  - name: Collect correlated logs
    key: collect_logs
    type: logs.collect
    with:
      sources:
        - name: run-evidence-json
          type: dir_glob
          glob: ${runDir}/evidence/**/*.json
      match:
        include: ["${traceId}", "error", "exception"]
      maxLines: 500

  - name: Publish run to Jira
    key: publish_to_jira
    type: jira.publish
    with:
      issueKey: "${env.JIRA_ISSUE_KEY}"
      attach:
        - report.html
        - summary.json
        - manifest.json
        - bundle_signature.json
      apiVersion: 2
      softFail: false

cleanup_steps:
  - name: Stop AppLauncher session
    key: stop_applauncher
    type: applauncher.session.stop
    with:
      session: fednow-rtpay-golden

name: Continuum Architecture React

on:
  pull_request:
    paths:
      - "visuals/continuum-architecture-react/**"
      - ".github/workflows/continuum-architecture-react.yml"
  push:
    branches:
      - main
    paths:
      - "visuals/continuum-architecture-react/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visuals/continuum-architecture-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visuals/continuum-architecture-react/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

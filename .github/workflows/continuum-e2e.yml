name: Continuum E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: continuum-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuum:
    runs-on: ubuntu-latest
    env:
      RUN_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SCENARIO: examples/golden-fednow-rtpay.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install newman
        run: npm i -g newman

      - name: Install Continuum
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate + Plan
        run: |
          continuum validate "${SCENARIO}"
          continuum plan "${SCENARIO}" --run-id "${RUN_ID}"

      - name: Run scenario + verify + publish
        env:
          CONTINUUM_SIGNING_KEY: ${{ secrets.CONTINUUM_SIGNING_KEY }}
          CONTINUUM_SIGNING_KEY_ID: ci
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ secrets.JIRA_ISSUE_KEY }}
          CONTINUUM_SITE_URL: ${{ secrets.CONTINUUM_SITE_URL }}
          CONTINUUM_ENABLE_LIVE_CONNECTORS: "1"
        run: |
          python -m continuum run "${SCENARIO}" --run-id "${RUN_ID}"
          python -m continuum verify --run-id "${RUN_ID}" --runs-dir runs
          python -m continuum publish --run-id "${RUN_ID}" --runs-dir runs --site-dir site

      - name: Job summary
        if: always()
        run: |
          echo "## Continuum Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: \`${RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: \`runs/${RUN_ID}/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Step Summary (from summary.json)" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import os

          run_id = os.environ["RUN_ID"]
          summary_path = Path("runs") / run_id / "summary.json"
          if not summary_path.exists():
              print("- summary.json not found")
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          for step in summary.get("steps", []):
              name = step.get("name") or step.get("key") or "step"
              status = (step.get("status") or "unknown").upper()
              ms = step.get("ms", 0)
              print(f"- **{status}** {name} ({ms} ms)")
          PY

      - name: Upload run bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuum-runs-${{ env.RUN_ID }}
          path: runs/${{ env.RUN_ID }}
          if-no-files-found: warn

      - name: Comment on PR (sticky)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.RUN_ID;
            const body =
`<!-- continuum-autopilot -->
### Continuum E2E
- Run ID: \`${runId}\`
- Artifact: **continuum-runs-${runId}** (download from Actions)
- Bundle path: \`runs/${runId}/\`

(See the job summary for step statuses.)`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const tag = "<!-- continuum-autopilot -->";
            const existing = comments.data.find((c) => c.body && c.body.includes(tag));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

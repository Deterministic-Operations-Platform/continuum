name: Continuum Architecture Preview

on:
  push:
    branches: [main]
    paths:
      - "visuals/continuum-architecture-react/**"
      - ".github/workflows/continuum-architecture-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: continuum-architecture-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visuals/continuum-architecture-react/package.json
      - name: Install dependencies
        working-directory: visuals/continuum-architecture-react
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: visuals/continuum-architecture-react
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: visuals/continuum-architecture-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

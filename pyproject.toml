[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Deterministic orchestration and evidence for high-stakes engineering workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "cryptography>=50.0.1",
]

[project.scripts]
continuum = "continuum.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["continuum*"]

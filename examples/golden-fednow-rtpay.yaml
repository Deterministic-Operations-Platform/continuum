name: fednow-rtpay-golden
rail: fednow
vars:
  issueKey: RTPAY-123

steps:
  - name: start-applauncher
    type: applauncher.start
    with:
      command: python
      args: ["-m", "http.server", "8077"]
    publish:
      appPid: $.details.pid

  - name: wait-health
    type: http.health
    with:
      url: http://127.0.0.1:8077
      timeoutSec: 30
      retries: 3
      backoffMs: 1000
    publish:
      healthStatus: $.details.status

  - name: run-collection
    type: postman.run
    with:
      collection: collections/fednow-camt29.postman_collection.json
      retries: 1
      backoffMs: 2000

  - name: verify-database
    type: mongo.verify
    with:
      uri: ${env.MONGO_URI}
      db: payments
      queries:
        - name: inboundMessages
          collection: inbound_requests
          filter:
            requestRef: CAMT29-001
      assert:
        - query: inboundMessages
          op: gte
          value: 1

  - name: jira-comment
    type: jira.comment
    with:
      issueKey: ${issueKey}
      body: "Run ${runId} completed with health status ${healthStatus}."

  - name: jira-attach-evidence
    type: jira.attach
    with:
      issueKey: ${issueKey}
      files:
        - ${runDir}/evidence/**/newman-report.html
        - ${runDir}/summary.json

cleanup_steps:
  - name: stop-applauncher
    type: applauncher.stop
    with:
      pid: ${appPid}

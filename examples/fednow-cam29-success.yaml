name: fednow-cam29-success
rail: fednow
vars:
  issueKey: CAM29-LOCAL

steps:
  - name: Start AppLauncher service
    key: start_service
    type: applauncher.start
    with:
      command: python
      args: ["-m", "http.server", "8085"]
      cwd: .

  - name: Verify health endpoint
    type: http.health
    dependsOn: [start_service]
    with:
      url: http://127.0.0.1:8085
      timeoutSec: 5

cleanup_steps:
  - name: Stop AppLauncher service
    type: applauncher.stop
